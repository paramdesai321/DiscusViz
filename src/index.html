<
<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>DiscusViz</title>
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: system-ui;
        }

        #bar {
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }

        #cy {
            height: calc(100vh - 52px);
        }

        button, select {
            padding: 6px 10px;
        }
    </style>
</head>
<body>
    <div id="bar">
        <textarea id="inputText" placeholder="Paste social media post here..." rows="2" style="width:300px;"></textarea>
        <button id="generate">Generate Graph</button>
        <button id="addNode">Add node</button>
        <button id="editSelected">Edit selected</button>
        <button id="duplicateSelected">Duplicate selected</button>
        <button id="deleteSelected">Delete selected</button>
        <button id="undoBtn">Undo</button>
        <select id="edgeType">
            <option value="reply">reply</option>
            <option value="supports">supports</option>
            <option value="contradicts">contradicts</option>
            <option value="references">references</option>
        </select>
        <span>Tip: click two nodes to create an edge.</span>
    </div>
    <div id="cy"></div>

    <script>
        const API = "http://127.0.0.1:8000";

        let cy = cytoscape({
            container: document.getElementById("cy"),
            elements: [],
            style: [
                {
                    selector: "node",
                    style: {
                        "label": "data(label)",
                        "font-size": "10px",
                        "text-wrap": "wrap",
                        "text-max-width": "80px",
                        "text-valign": "center",
                        "text-halign": "center"
                    }
                },
                {
                    selector: "edge",
                    style: {
                        "label": "data(type)",
                        "font-size": "8px",
                        "curve-style": "bezier",
                        "target-arrow-shape": "triangle",
                        "text-background-color": "#ffffff",
                        "text-background-opacity": 1,
                        "text-background-padding": "2px"
                    }
                },
                {
                    selector: ".selected",
                    style: {
                        "border-width": 3,
                        "border-color": "blue"
                    }
                }
            ],
            layout: {
                name: "cose",
                padding: 80,
                nodeRepulsion: 8000,
                idealEdgeLength: 120,
                edgeElasticity: 0.45
            }
        });

        async function loadGraph() {
            const r = await fetch(`${API}/graph`);
            const g = await r.json();
            cy.elements().remove();
            cy.add([...g.nodes, ...g.edges]);
            cy.layout({ name: "cose" }).run();
            selectedElement = null;
            first = null;
        }

        document.getElementById("addNode").onclick = async () => {
            const title = prompt("Node title?");
            if (!title) return;
            const body = prompt("Body (optional)?") || "";
            await fetch(`${API}/nodes`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, body })
            });
            await loadGraph();
        };

        // create edges by selecting two nodes
        let first = null;
        let selectedElement = null;

        cy.on("tap", "node", async (evt) => {
            const n = evt.target;

            cy.elements().removeClass("selected");
            n.addClass("selected");
            selectedElement = n;

            if (!first) {
                first = n;
                return;
            }

            const second = n;
            const type = document.getElementById("edgeType").value;

            if (first.id() === second.id()) {
                first.removeClass("selected");
                first = null;
                return;
            }

            await fetch(`${API}/edges`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ source: first.id(), target: second.id(), type })
            });

            first.removeClass("selected");
            first = null;
            await loadGraph();
        });

        // added: click edge to select it
        cy.on("tap", "edge", (evt) => {
            cy.elements().removeClass("selected");
            const e = evt.target;
            e.addClass("selected");
            selectedElement = e;
            first = null;
        });

        // added: click empty canvas to clear selection
        cy.on("tap", (evt) => {
            if (evt.target === cy) {
                cy.elements().removeClass("selected");
                selectedElement = null;
                first = null;
            }
        });

        // double click node to rename
        cy.on("dblclick", "node", async (evt) => {
            const n = evt.target;
            alert("Renaming/editing body is the next step (add PUT /nodes/{id}).");
        });

        // added: edit selected node or edge
        document.getElementById("editSelected").onclick = async () => {
            if (!selectedElement) {
                alert("Select a node or edge first.");
                return;
            }

            if (selectedElement.group() === "nodes") {
                const currentTitle = selectedElement.data("label");
                const currentBody = selectedElement.data("body") || "";

                const newTitle = prompt("Edit node title:", currentTitle);
                if (newTitle === null || newTitle.trim() === "") return;

                const newBody = prompt("Edit node body:", currentBody);
                if (newBody === null) return;

                await fetch(`${API}/nodes/${selectedElement.id()}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title: newTitle, body: newBody })
                });

                await loadGraph();
            } else if (selectedElement.group() === "edges") {
                const currentType = selectedElement.data("type");
                const newType = prompt("Edit edge type:", currentType);
                if (newType === null || newType.trim() === "") return;

                await fetch(`${API}/edges/${selectedElement.id()}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        source: selectedElement.data("source"),
                        target: selectedElement.data("target"),
                        type: newType
                    })
                });

                await loadGraph();
            }
        };

        // added: duplicate selected node
        document.getElementById("duplicateSelected").onclick = async () => {
            if (!selectedElement || selectedElement.group() !== "nodes") {
                alert("Select a node to duplicate.");
                return;
            }

            await fetch(`${API}/nodes/${selectedElement.id()}/duplicate`, {
                method: "POST"
            });

            await loadGraph();
        };

        // added: delete selected node or edge
        document.getElementById("deleteSelected").onclick = async () => {
            if (!selectedElement) {
                alert("Select a node or edge first.");
                return;
            }

            if (selectedElement.group() === "nodes") {
                await fetch(`${API}/nodes/${selectedElement.id()}`, {
                    method: "DELETE"
                });
            } else if (selectedElement.group() === "edges") {
                await fetch(`${API}/edges/${selectedElement.id()}`, {
                    method: "DELETE"
                });
            }

            await loadGraph();
        };

        // added: undo
        document.getElementById("undoBtn").onclick = async () => {
            const r = await fetch(`${API}/undo`, {
                method: "POST"
            });

            if (!r.ok) {
                const err = await r.json();
                alert(err.detail || "Undo failed");
                return;
            }

            await loadGraph();
        };

        document.getElementById("generate").onclick = async () => {
            const text = document.getElementById("inputText").value;

            if (!text) {
                alert("Enter some text first");
                return;
            }

            await fetch(`${API}/generate`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ text })
            });

            await loadGraph(); // refresh graph
        };

        loadGraph();
    </script>
</body>
</html>
